<meta charset="utf-8">
<style>
body{margin:0;padding:10px;font:12px/1.4 Inter,system-ui,sans-serif;background:var(--figma-color-bg,#fff);color:var(--figma-color-text,#222)}
.dim{color:var(--figma-color-text-secondary,#666)}.small{font-size:11px}
.line{display:flex;align-items:center;gap:8px;min-height:28px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--figma-color-icon-tertiary,#999)}
.ok{background:var(--figma-color-icon-success,#1a9e5c)}.err{background:var(--figma-color-icon-danger,#d93a36)}.wait{background:var(--figma-color-icon-warning,#d98b00)}.busy{background:var(--figma-color-icon-brand,#0d99ff)}
.wait,.busy{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.wait,.busy{animation:none}}
#sub{padding-left:16px;word-break:break-word}
#frames{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
#frames li{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:4px;background:var(--figma-color-bg-secondary,#f2f2f2)}
#frames .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#note{margin-top:8px;padding:6px 8px;border-radius:4px;background:var(--figma-color-bg-warning-tertiary,#fff1d6)}
#load{width:100%;height:28px;margin-top:8px;border:0;border-radius:4px;font:inherit;cursor:pointer;background:var(--figma-color-bg-brand,#0d99ff);color:var(--figma-color-text-onbrand,#fff)}
#load:disabled{opacity:.5;cursor:default}
body.drop{outline:2px dashed var(--figma-color-border-brand,#0d99ff);outline-offset:-4px}
.imp-cancel{width:100%;height:28px;margin-top:6px;border:0;border-radius:4px;font:inherit;cursor:pointer;background:var(--figma-color-bg-secondary,#eee);color:inherit}
.imp-cancel:hover{background:var(--figma-color-bg-hover,#e4e4e4)}
.warn{background:var(--figma-color-icon-warning,#d98b00)}
#imp{margin-top:8px;display:flex;flex-direction:column;gap:2px;word-break:break-word}
#imp .line{min-height:24px}
#imp .imp-more{font-weight:400}
#imp details{border-radius:4px;background:var(--figma-color-bg-secondary,#f2f2f2)}
#imp summary{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;cursor:pointer;list-style:none}
#imp summary::-webkit-details-marker{display:none}
#imp .imp-grow{flex:1;min-width:0}
#imp .imp-chev{color:var(--figma-color-text-secondary,#666);transition:transform .15s}
#imp details[open] .imp-chev{transform:rotate(90deg)}
#imp ul{margin:0;padding:2px 8px 8px 24px;color:var(--figma-color-text-secondary,#666)}
#imp li{margin:2px 0}
@media (prefers-reduced-motion:reduce){#imp .imp-chev{transition:none}}
#retry{width:100%;height:28px;margin-top:8px;border:0;border-radius:4px;font:inherit;cursor:pointer;background:var(--figma-color-bg-secondary,#eee);color:inherit}
#retry:hover{background:var(--figma-color-bg-hover,#e4e4e4)}
</style>
<div id="app">
  <div class="line"><span class="dot" id="dot"></span><span id="head">Looking for Inkwell&hellip;</span></div>
  <div class="dim" id="sub"></div>
  <ul id="frames" hidden></ul>
  <div id="note" hidden></div>
  <button id="retry" hidden>Ask again</button>
  <button id="load">Load SWF&hellip;</button>
  <input id="file" type="file" accept=".swf" hidden>
  <div id="imp" class="small" hidden></div>
</div>
<script>/*SCRIPT*/</script>
